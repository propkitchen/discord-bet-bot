name: BetTracker checks

on:
  push:
    branches:
      - commercial-dev
      - release/november-2026-bot
  pull_request:
    branches:
      - commercial-dev
      - main

jobs:
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q bot.py bettracker_excel.py bettracker_visuals.py tools tests
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -v
